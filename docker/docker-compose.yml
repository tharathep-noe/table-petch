# Test databases for table-petch. Brings up Postgres and MySQL, each seeded
# with a small schema so the GUI has tables, views, and routines to browse.
#
#   cd docker && docker compose up -d     # start
#   docker compose down -v                # stop and wipe volumes
#
# Connect from the app with the credentials below (host: localhost).

services:
  postgres:
    image: postgres:16
    container_name: table-petch-postgres
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_USER: petch
      POSTGRES_PASSWORD: petch
      POSTGRES_DB: petchdb
    ports:
      - '5434:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petch -d petchdb']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: table-petch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: petch
      MYSQL_PASSWORD: petch
      MYSQL_DATABASE: petchdb
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'petch',
          '-ppetch',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
  mysql-data:
